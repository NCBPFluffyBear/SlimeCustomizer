# READ THE WIKI BEFORE CREATING A MACHINE! https://github.com/NCBPFluffyBear/SlimeCustomizer/blob/master/README.md

EXAMPLE_MACHINE:
  category: slime_customizer
  machine-name: "&bExample Machine"
  
  # [NEW FEATURE] TIER SETTING
  # Define the rarity/tier label displayed at the top of the item lore.
  # Available options: BASIC, AVERAGE, MEDIUM, GOOD, ADVANCED, END_GAME
  # If removed or invalid, it defaults to MEDIUM.
  tier: MEDIUM
  
  machine-lore:
  - "&7This is an example machine!"
  block-type: FURNACE
  progress-bar-item: FLINT_AND_STEEL
  
  stats:
    energy-consumption: 16
    energy-buffer: 64
    
    # [NEW FEATURE] SPEED MULTIPLIER
    # Determines how fast the machine processes items compared to the base time.
    # 1 = Normal Speed (1x)
    # 2 = Double Speed (2x)
    # 64 = Instant (64x)
    speed: 1
    
  crafting-recipe-type: ENHANCED_CRAFTING_TABLE
  crafting-recipe:
    1:
      type: VANILLA
      id: IRON_BLOCK
      amount: 1
    2:
      type: NONE
      id: N/A
      amount: 1
    3:
      type: VANILLA
      id: IRON_BLOCK
      amount: 1
    4:
      type: VANILLA
      id: IRON_BLOCK
      amount: 1
    5:
      type: SLIMEFUN
      id: SMALL_CAPACITOR
      amount: 1
    6:
      type: VANILLA
      id: IRON_BLOCK
      amount: 1
    7:
      type: VANILLA
      id: IRON_BLOCK
      amount: 1
    8:
      type: VANILLA
      id: IRON_BLOCK
      amount: 1
    9:
      type: VANILLA
      id: IRON_BLOCK
      amount: 1
      
  recipes:
    1:
      # This is the BASE duration. 
      # If 'speed' in stats is 2, this 5 seconds becomes 2.5 seconds.
      speed-in-seconds: 5
      input:
        1:
          type: VANILLA
          id: IRON_INGOT
          amount: 9
        2:
          type: NONE
          id: N/A
          amount: 1
      output:
        1:
          type: VANILLA
          id: IRON_BLOCK
          amount: 1
        2:
          type: NONE
          id: N/A
          amount: 1
    2:
      speed-in-seconds: 5
      input:
        1:
          type: SLIMEFUN
          id: GOLD_24K
          amount: 9
        2:
          type: NONE
          id: N/A
          amount: 1
      output:
        1:
          type: SLIMEFUN
          id: GOLD_24K_BLOCK
          amount: 1
        2:
          type: NONE
          id: N/A
          amount: 1